[project]
name = "zecpath-ai"
version = "0.1.0"
description = "Zecpath AI Hiring Platform"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # Line length handled by formatter; relaxed for multiline dataset fixtures and prompts
    "E402",  # Allow sys.path mutations in standalone execution scripts
]
